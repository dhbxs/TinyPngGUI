[project]
name = "tinify-compress"
version = "1.0.0"
description = "Windows desktop client for Tinify / TinyPNG image compression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.23",
    "customtkinter>=5.2.2",
    "tinify>=1.6.0",
    "tkinterdnd2>=0.4.2",
]

[project.scripts]
tinify-compress = "tinify_app.gui:run_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinify_app"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = true
